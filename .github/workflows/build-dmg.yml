name: Build Spark Brow DMG
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x build_dmg.sh && ./build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Spark-Brow-DMG
          path: Spark-Brow.dmg
